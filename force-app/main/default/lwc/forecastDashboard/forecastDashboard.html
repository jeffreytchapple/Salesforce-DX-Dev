<template>
    <lightning-card title="Sales Forecast Dashboard (Monthly by Product Family)">
        <div class="slds-p-horizontal_medium slds-p-vertical_small slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input type="number" label="History Months" value={historyMonths} min="1" max="36" onchange={onHistoryChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input type="number" label="Horizon Months" value={horizonMonths} min="1" max="24" onchange={onHorizonChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-align_absolute-center">
                <lightning-button variant="brand" label="Refresh" onclick={refresh}></lightning-button>
            </div>
        </div>

        <template if:true={series}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="legend">
                    <span class="legend-item actual"></span>Actual
                    <span class="legend-item pipeline"></span>Pipeline (Weighted)
                    <span class="legend-item predicted"></span>Predicted
                </div>
            </div>
            <div class="slds-p-horizontal_medium slds-p-bottom_large">
                <canvas lwc:dom="manual" class="chart"></canvas>
            </div>
            <lightning-datatable key-field="key" data={tableRows} columns={columns} hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template if:false={series}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No data yet. Adjust filters and refresh.
            </div>
        </template>
    </lightning-card>
</template>
